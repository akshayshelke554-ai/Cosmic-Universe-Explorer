
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Universe Explorer</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#02040c;color:white;font-family:Arial}
h2{position:absolute;top:12px;width:100%;text-align:center;z-index:2}
#info{position:absolute;bottom:20px;left:15px;background:#101a30;padding:12px;border-radius:10px;z-index:2}
canvas{
  display:block;
  touch-action:none;
}
#error{position:absolute;top:90px;left:10px;right:10px;color:#ffaaaa;text-align:center;z-index:3}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<h2>🌌 COSMIC UNIVERSE EXPLORER</h2>
<div id="info">Our Solar System<br>Explore the planets in 3D</div>
<div id="error"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

try {
const scene = new THREE.Scene();
const textureLoader = new THREE.TextureLoader();
  const textureUrls = {
  Mercury: 'https://threejs.org/examples/textures/planets/mercury.jpg',
  Venus: 'https://threejs.org/examples/textures/planets/venus.jpg',
  Earth: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
  Mars: 'https://threejs.org/examples/textures/planets/mars_1k_color.jpg',
  Jupiter: 'https://threejs.org/examples/textures/planets/jupiter.jpg',
  Saturn: 'https://threejs.org/examples/textures/planets/saturn.jpg',
  Uranus: 'https://threejs.org/examples/textures/planets/uranus.jpg',
  Neptune: 'https://threejs.org/examples/textures/planets/neptune.jpg'
};
scene.background = new THREE.Color(0x02040c);

// REALISTIC STARFIELD
const starGeometry = new THREE.BufferGeometry();
const starPositions = [];
const starSizes = [];

for (let i = 0; i < 8000; i++) {
  const x = (Math.random() - 0.5) * 700;
  const y = (Math.random() - 0.5) * 700;
  const z = (Math.random() - 0.5) * 700;

  starPositions.push(x, y, z);
}

starGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(starPositions, 3)
);

const starColors = [
  new THREE.Color(0xffffff),
  new THREE.Color(0x9bbcff),
  new THREE.Color(0xffcc88),
  new THREE.Color(0xffaaaa),
  new THREE.Color(0xaaddff)
];

const colors = [];

for (let i = 0; i < starPositions.length / 3; i++) {
  const color = starColors[
    Math.floor(Math.random() * starColors.length)
  ];

  colors.push(color.r, color.g, color.b);
}

starGeometry.setAttribute(
  'color',
  new THREE.Float32BufferAttribute(colors, 3)
);

const starMaterial = new THREE.PointsMaterial({
  size: 1.5,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  sizeAttenuation: true,
  depthWrite: false
});

const stars = new THREE.Points(
  starGeometry,
  starMaterial
);

scene.add(stars);
  
const galaxyGeometry = new THREE.BufferGeometry();
const galaxyPositions = [];

for (let i = 0; i < 5000; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = Math.random() * 100;

  const x = Math.cos(angle) * radius;
  const y = (Math.random() - 0.5) * 8;
  const z = Math.sin(angle) * radius;

  galaxyPositions.push(x, y, z);
}

galaxyGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(galaxyPositions, 3)
);

const galaxyMaterial = new THREE.PointsMaterial({
  color: 0x9988ff,
  size: 0.35,
  transparent: true,
  opacity: 0.4,
  depthWrite: false
});

const galaxy = new THREE.Points(
  galaxyGeometry,
  galaxyMaterial
);

scene.add(galaxy);
  
let starTime = 0;

function animateStars() {
  starTime += 0.02;

  starMaterial.opacity =
    0.65 + Math.sin(starTime) * 0.3;
}
const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,45,180);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setClearColor(0x02040c);
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enabled = true;
controls.enableDamping=true;
controls.dampingFactor = 0.05;
controls.minDistance = 1;
controls.maxDistance = 500;
controls.zoomSpeed = 1.5;
controls.enableZoom = true;
controls.enablePan = true;
controls.rotateSpeed = 0.5;
controls.touches.ONE = THREE.TOUCH.ROTATE;
controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;
scene.add(new THREE.AmbientLight(0xffffff, 2));

const light = new THREE.PointLight(
  0xffffff,
  150,
  300,
  2
);

light.position.set(0, 0, 0);
scene.add(light);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
fillLight.position.set(-20, 20, 30);
scene.add(fillLight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(15.5, 128, 128),
  new THREE.MeshBasicMaterial({
    color: 0xffcc44
  })
);
  const sunLight = new THREE.PointLight(
  0xffaa33,
  180,
  300
);

sunLight.position.set(0, 0, 0);
scene.add(sunLight);
scene.add(sun);

// Sun outer glow
const sunGlow = new THREE.Mesh(
  new THREE.SphereGeometry(17.5, 128, 128),
  new THREE.MeshBasicMaterial({
    color: 0xff8800,
    transparent: true,
    opacity: 0.22,
    side: THREE.BackSide,
    depthWrite: false
  })
);
sun.add(sunGlow);
sunGlow.scale.set(1.15, 1.15, 1.15);
// Bright sunlight
light.position.set(0, 0, 0);
light.intensity = 150;

const planets=[
 ['Mercury',0.052,20,0x898780],
 ['Venus',0.130,27,0xd9a66b],
 ['Earth',0.137,35,0x2877c9],
 ['Mars',0.073,45,0xb65335],
 ['Jupiter',1.5,65,0xc69b72],
 ['Saturn',1.25,85,0xd8c69a],
 ['Uranus',0.546,105,0x8ed9df],
 ['Neptune',0.529,125,0x3157a5]
];

const moonData = {
  Earth: [
    ["Moon", 0.22, 1.5, 0xcccccc]
  ],
  Mars: [
    ["Phobos", 0.10, 1.0, 0x999999],
    ["Deimos", 0.08, 1.5, 0xaaaaaa]
  ],
  Jupiter: [
    ["Io", 0.16, 2.0, 0xffcc66],
    ["Europa", 0.14, 2.6, 0xeeeecc],
    ["Ganymede", 0.22, 3.2, 0xaaaaaa],
    ["Callisto", 0.19, 3.9, 0x777777]
  ],
  Saturn: [
    ["Titan", 0.20, 2.5, 0xddaa66],
    ["Enceladus", 0.09, 3.1, 0xeeeeff],
    ["Rhea", 0.13, 3.7, 0xcccccc],
    ["Iapetus", 0.12, 4.3, 0x888888]
  ],
  Uranus: [
    ["Titania", 0.14, 2.0, 0xaaaaaa],
    ["Oberon", 0.13, 2.6, 0x999999],
    ["Ariel", 0.10, 3.2, 0xdddddd],
    ["Umbriel", 0.10, 3.8, 0x777777],
    ["Miranda", 0.08, 4.4, 0xcccccc]
  ],
  Neptune: [
    ["Triton", 0.15, 2.0, 0x99bbdd],
    ["Nereid", 0.08, 2.8, 0xaaaaaa]
  ]
};
  
const objects=[];
const orbitPivots = [];
planets.forEach((p,i)=>{
  const orbitPivot = new THREE.Group();
 scene.add(orbitPivot);
 orbitPivots.push(orbitPivot);
const planetTexture = textureLoader.load(
  textureUrls[p[0]],
  () => console.log(p[0] + " Texture Loaded"),
  undefined,
  (error) => console.error(p[0] + " Texture Error", error)
);

const material = new THREE.MeshStandardMaterial({
  color: p[3],
  roughness: 0.9,
  metalness: 0
});

const mesh = new THREE.Mesh(
  new THREE.SphereGeometry(p[1], 96, 96),
  material
);

mesh.position.x = p[2];
orbitPivot.add(mesh);
objects.push(mesh);

 const orbit=new THREE.Mesh(
  new THREE.RingGeometry(p[2]-0.015,p[2]+0.015,128),
  new THREE.MeshBasicMaterial({color:0x445577,side:THREE.DoubleSide})
);
 orbit.rotation.x=Math.PI/2;
 scene.add(orbit);

 if(p[0]==='Saturn'){
  const ring=new THREE.Mesh(
   new THREE.RingGeometry(1.6,2.5,64),
   new THREE.MeshStandardMaterial({
     color: 0xd8c69a,
     side: THREE.DoubleSide,
     transparent: true,
     opacity: 0.85,
     roughness: 0.8
   })
  );
  ring.rotation.x=Math.PI/2.5;
  mesh.add(ring);
}
});
const moonPivots = [];
const moonObjects = [];

objects.forEach((planetMesh, index) => {
  const planetName = planets[index][0];
  const moons = moonData[planetName] || [];

  moons.forEach((m, i) => {
    const pivot = new THREE.Group();
    planetMesh.add(pivot);

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(m[1], 32, 32),
      new THREE.MeshStandardMaterial({
        color: m[3],
        roughness: 0.9
      })
    );

    moon.position.x = m[2];
    moon.userData.name = m[0];

    pivot.add(moon);
    moonPivots.push(pivot);
    moonObjects.push(moon);
  });
});
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
  let desiredCameraPosition = camera.position.clone();
let desiredTarget = new THREE.Vector3();

function focusOnPlanet(object) {
  const target = new THREE.Vector3();
  object.getWorldPosition(target);

  const radius = object.geometry.parameters.radius;
  const distance = Math.max(radius * 5 + 3, 8);
  const direction = camera.position.clone()
    .sub(target)
    .normalize();

  desiredTarget.copy(target);

  desiredCameraPosition.copy(
    target.clone().add(
      direction.multiplyScalar(distance)
    )
  );

  desiredCameraPosition.y += radius * 2;
}

renderer.domElement.addEventListener('pointerdown', (event) => {
  const rect = renderer.domElement.getBoundingClientRect();

  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);

  const hits = raycaster.intersectObjects([...objects, ...moonObjects], false);

  if (hits.length > 0) {
    const selected = hits[0].object;
    focusOnPlanet(selected);
const panel = document.getElementById('planet-info');

if (moonObjects.includes(selected)) {
  const moonName = selected.userData.name;

  const moonDetails = {
    Moon: "Earth's only natural satellite. पृथ्वीचा एकमेव नैसर्गिक उपग्रह.",
    Phobos: "Mars' inner moon. मंगळाचा सर्वात जवळचा चंद्र.",
    Deimos: "Mars' outer moon. मंगळाचा दुसरा चंद्र.",
    Io: "Jupiter's volcanic moon. ज्वालामुखींसाठी प्रसिद्ध.",
    Europa: "An icy moon that may have a subsurface ocean.",
    Ganymede: "The largest moon in the Solar System.",
    Callisto: "A heavily cratered moon of Jupiter.",
    Titan: "Saturn's largest moon with a thick atmosphere.",
    Enceladus: "An icy moon with water-rich plumes.",
    Rhea: "One of Saturn's major icy moons.",
    Iapetus: "Known for its two-tone surface.",
    Titania: "The largest moon of Uranus.",
    Oberon: "A major moon of Uranus.",
    Ariel: "An icy moon of Uranus.",
    Umbriel: "A dark moon of Uranus.",
    Miranda: "A small moon with unusual surface features.",
    Triton: "Neptune's large moon with a retrograde orbit.",
    Nereid: "A Neptune moon with a highly elliptical orbit."
  };

  document.getElementById('planet-name').textContent = moonName;

document.getElementById('planet-description').textContent =
  moonDetails[moonName] || 'Natural satellite';

panel.style.display = 'block';
return;
}
    const index = objects.indexOf(hits[0].object);
    const name = planets[index][0];

const details = {
  Mercury:
    "बुध (Mercury)<br>" +
    "Diameter: 4,879 km<br>" +
    "Sun Distance: 57.9 million km<br>" +
    "Year: 88 Earth days<br>" +
    "Day: 59 Earth days<br>" +
    "विशेष: सूर्याच्या सर्वात जवळचा आणि सर्वात लहान ग्रह.",

  Venus:
    "शुक्र (Venus)<br>" +
    "Diameter: 12,104 km<br>" +
    "Sun Distance: 108.2 million km<br>" +
    "Year: 225 Earth days<br>" +
    "Day: 243 Earth days<br>" +
    "विशेष: सौरमालेतील सर्वात उष्ण ग्रह.",

  Earth:
    "पृथ्वी (Earth)<br>" +
    "Diameter: 12,742 km<br>" +
    "Sun Distance: 149.6 million km<br>" +
    "Year: 365.25 days<br>" +
    "Day: 24 hours<br>" +
    "विशेष: जीवन अस्तित्वात असल्याचे ज्ञात असलेला एकमेव ग्रह.",

  Mars:
    "मंगळ (Mars)<br>" +
    "Diameter: 6,779 km<br>" +
    "Sun Distance: 227.9 million km<br>" +
    "Year: 687 Earth days<br>" +
    "Day: 24 hours 37 minutes<br>" +
    "विशेष: लाल ग्रह. येथे Olympus Mons हा विशाल ज्वालामुखी आहे.",

  Jupiter:
    "गुरू (Jupiter)<br>" +
    "Diameter: 139,820 km<br>" +
    "Sun Distance: 778.6 million km<br>" +
    "Year: 11.86 Earth years<br>" +
    "Day: 9 hours 56 minutes<br>" +
    "विशेष: सौरमालेतील सर्वात मोठा ग्रह. Great Red Spot वादळासाठी प्रसिद्ध.",

  Saturn:
    "शनी (Saturn)<br>" +
    "Diameter: 116,460 km<br>" +
    "Sun Distance: 1.43 billion km<br>" +
    "Year: 29.4 Earth years<br>" +
    "Day: 10.7 hours<br>" +
    "विशेष: बर्फ आणि खडकांपासून बनलेल्या सुंदर कड्यांसाठी प्रसिद्ध.",

  Uranus:
    "युरेनस (Uranus)<br>" +
    "Diameter: 50,724 km<br>" +
    "Sun Distance: 2.87 billion km<br>" +
    "Year: 84 Earth years<br>" +
    "Day: 17 hours 14 minutes<br>" +
    "विशेष: बाजूला कलून फिरणारा निळसर-हिरवा बर्फाळ ग्रह.",

  Neptune:
    "नेपच्यून (Neptune)<br>" +
    "Diameter: 49,244 km<br>" +
    "Sun Distance: 4.50 billion km<br>" +
    "Year: 165 Earth years<br>" +
    "Day: 16 hours<br>" +
    "विशेष: सूर्यापासून सर्वात दूरचा ग्रह. येथे अतिवेगवान वारे वाहतात."
};

    document.getElementById('planet-name').textContent = name;

document.getElementById('planet-description').innerHTML = details[name];

panel.style.display = 'block';
  }
});
 
function animate(){
 requestAnimationFrame(animate);
 animateStars();
 sun.rotation.y+=0.002;
  galaxy.rotation.y += 0.0001;
  orbitPivots.forEach((pivot, i) => {
  pivot.rotation.y += 0.002 / (i + 1);
});
  moonPivots.forEach((p,i) => {
  p.rotation.y += 0.01 + (i * 0.002);
});
 objects.forEach((p,i)=>p.rotation.y+=0.005+(i*0.001));
  
 controls.update();
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
});
} catch(e) {
 document.getElementById('error').textContent='3D Error: '+e.message;
 console.error(e);
}
</script>

<div id="planet-info" style="
position:fixed;
bottom:20px;
left:15px;
right:15px;
max-width:420px;
padding:18px;
background:rgba(5,15,35,0.94);
color:white;
border:1px solid #00d9ff;
border-radius:18px;
font-family:Arial;
z-index:9999;
display:none;
box-shadow:0 0 25px rgba(0,217,255,0.25);
">
  <button id="close-info" style="
  position:absolute;
  top:10px;
  right:12px;
  background:#ff3344;
  color:white;
  border:none;
  border-radius:50%;
  width:30px;
  height:30px;
  font-size:18px;
  cursor:pointer;
  ">×</button>

  <h3 id="planet-name">Planet Name</h3>
  <p id="planet-description">Planet details appear here.</p>
</div>

<script>
document.getElementById('close-info')
.addEventListener('click', function() {
  document.getElementById('planet-info').style.display = 'none';
});
</script>

</body>
</html>
