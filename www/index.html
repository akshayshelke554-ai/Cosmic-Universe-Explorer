
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Universe Explorer</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#02040c;color:white;font-family:Arial}
h2{position:absolute;top:12px;width:100%;text-align:center;z-index:2}
#info{position:absolute;bottom:20px;left:15px;background:#101a30;padding:12px;border-radius:10px;z-index:2}
canvas{display:block}
#error{position:absolute;top:90px;left:10px;right:10px;color:#ffaaaa;text-align:center;z-index:3}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<h2>🌌 COSMIC UNIVERSE EXPLORER</h2>
<div id="info">Our Solar System<br>Explore the planets in 3D</div>
<div id="error"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

try {
const scene = new THREE.Scene();
const textureLoader = new THREE.TextureLoader();
scene.background = new THREE.Color(0x02040c);

// REALISTIC SPACE STARFIELD
const starGeometry = new THREE.BufferGeometry();
const starPositions = [];

for (let i = 0; i < 4000; i++) {
  const x = (Math.random() - 0.5) * 500;
  const y = (Math.random() - 0.5) * 500;
  const z = (Math.random() - 0.5) * 500;

  starPositions.push(x, y, z);
}

starGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(starPositions, 3)
);

const starMaterial = new THREE.PointsMaterial({
  color: 0xffffff,
  size: 0.8,
  transparent: true,
  opacity: 0.9,
  sizeAttenuation: true,
  depthWrite: false
});

const stars = new THREE.Points(
  starGeometry,
  starMaterial
);

scene.add(stars);
  
const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,12,32);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

scene.add(new THREE.AmbientLight(0xffffff,1.2));
const light = new THREE.PointLight(0xffffff,3,200);
scene.add(light);

const sun = new THREE.Mesh(
 new THREE.SphereGeometry(2,48,48),
 new THREE.MeshBasicMaterial({color:0xffaa22})
);
scene.add(sun);

const planets=[
 ['Mercury',0.45,4,0x898780],
 ['Venus',0.7,6,0xd9a66b],
 ['Earth',0.8,9,0x2877c9],
 ['Mars',0.6,12,0xb65335],
 ['Jupiter',1.5,16,0xc69b72],
 ['Saturn',1.3,20,0xd8c69a],
 ['Uranus',1,24,0x8ed9df],
 ['Neptune',1,28,0x3157a5]
];

const moonData = {
  Earth: [
    ["Moon", 0.22, 1.5, 0xcccccc]
  ],
  Mars: [
    ["Phobos", 0.10, 1.0, 0x999999],
    ["Deimos", 0.08, 1.5, 0xaaaaaa]
  ],
  Jupiter: [
    ["Io", 0.16, 2.0, 0xffcc66],
    ["Europa", 0.14, 2.6, 0xeeeecc],
    ["Ganymede", 0.22, 3.2, 0xaaaaaa],
    ["Callisto", 0.19, 3.9, 0x777777]
  ],
  Saturn: [
    ["Titan", 0.20, 2.5, 0xddaa66],
    ["Enceladus", 0.09, 3.1, 0xeeeeff],
    ["Rhea", 0.13, 3.7, 0xcccccc],
    ["Iapetus", 0.12, 4.3, 0x888888]
  ],
  Uranus: [
    ["Titania", 0.14, 2.0, 0xaaaaaa],
    ["Oberon", 0.13, 2.6, 0x999999],
    ["Ariel", 0.10, 3.2, 0xdddddd],
    ["Umbriel", 0.10, 3.8, 0x777777],
    ["Miranda", 0.08, 4.4, 0xcccccc]
  ],
  Neptune: [
    ["Triton", 0.15, 2.0, 0x99bbdd],
    ["Nereid", 0.08, 2.8, 0xaaaaaa]
  ]
};
  
const objects=[];
planets.forEach((p,i)=>{
 
const material = new THREE.MeshStandardMaterial({
  color: p[3],
  roughness: 0.9,
  metalness: 0.0
});

const textureUrls = {
  Mercury: 'https://www.solarsystemscope.com/textures/download/2k_mercury.jpg',
  Venus: 'https://www.solarsystemscope.com/textures/download/2k_venus_surface.jpg',
  Earth: 'https://www.solarsystemscope.com/textures/download/2k_earth_daymap.jpg',
  Mars: 'https://www.solarsystemscope.com/textures/download/2k_mars.jpg',
  Jupiter: 'https://www.solarsystemscope.com/textures/download/2k_jupiter.jpg',
  Saturn: 'https://www.solarsystemscope.com/textures/download/2k_saturn.jpg',
  Uranus: 'https://www.solarsystemscope.com/textures/download/2k_uranus.jpg',
  Neptune: 'https://www.solarsystemscope.com/textures/download/2k_neptune.jpg'
};

const textureUrl = textureUrls[p[0]];

if (textureUrl) {
  material.map = textureLoader.load(
    textureUrl,
    undefined,
    undefined,
    (error) => console.error('Texture loading failed:', p[0], error)
  );
  material.color.set(0xffffff);
}

const mesh = new THREE.Mesh(
  new THREE.SphereGeometry(p[1], 96, 96),
  material
);

mesh.position.x = p[2];
scene.add(mesh);
objects.push(mesh);


 const orbit=new THREE.Mesh(
  new THREE.RingGeometry(p[2]-0.015,p[2]+0.015,128),
  new THREE.MeshBasicMaterial({color:0x445577,side:THREE.DoubleSide})
 );
 orbit.rotation.x=Math.PI/2;
 scene.add(orbit);

 if(p[0]==='Saturn'){
  const ring=new THREE.Mesh(
   new THREE.RingGeometry(1.6,2.5,64),
   new THREE.MeshStandardMaterial({color:0xc9b58b,side:THREE.DoubleSide})
  );
  ring.rotation.x=Math.PI/2.5;
  mesh.add(ring);
 }
});
const moonPivots = [];
const moonObjects = [];

objects.forEach((planetMesh, index) => {
  const planetName = planets[index][0];
  const moons = moonData[planetName] || [];

  moons.forEach((m, i) => {
    const pivot = new THREE.Group();
    planetMesh.add(pivot);

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(m[1], 32, 32),
      new THREE.MeshStandardMaterial({
        color: m[3],
        roughness: 0.9
      })
    );

    moon.position.x = planets[index][1] + m[2];
    moon.userData.name = m[0];

    pivot.add(moon);
    moonPivots.push(pivot);
    moonObjects.push(moon);
  });
});
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

renderer.domElement.addEventListener('pointerdown', (event) => {
  const rect = renderer.domElement.getBoundingClientRect();

  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);

  const hits = raycaster.intersectObjects([...objects, ...moonObjects]);

  if (hits.length > 0) {
    const selected = hits[0].object;
const panel = document.getElementById('planet-info');

if (moonObjects.includes(selected)) {
  const moonName = selected.userData.name;

  const moonDetails = {
    Moon: "Earth's only natural satellite. पृथ्वीचा एकमेव नैसर्गिक उपग्रह.",
    Phobos: "Mars' inner moon. मंगळाचा सर्वात जवळचा चंद्र.",
    Deimos: "Mars' outer moon. मंगळाचा दुसरा चंद्र.",
    Io: "Jupiter's volcanic moon. ज्वालामुखींसाठी प्रसिद्ध.",
    Europa: "An icy moon that may have a subsurface ocean.",
    Ganymede: "The largest moon in the Solar System.",
    Callisto: "A heavily cratered moon of Jupiter.",
    Titan: "Saturn's largest moon with a thick atmosphere.",
    Enceladus: "An icy moon with water-rich plumes.",
    Rhea: "One of Saturn's major icy moons.",
    Iapetus: "Known for its two-tone surface.",
    Titania: "The largest moon of Uranus.",
    Oberon: "A major moon of Uranus.",
    Ariel: "An icy moon of Uranus.",
    Umbriel: "A dark moon of Uranus.",
    Miranda: "A small moon with unusual surface features.",
    Triton: "Neptune's large moon with a retrograde orbit.",
    Nereid: "A Neptune moon with a highly elliptical orbit."
  };

  panel.innerHTML =
    '<h3>' + moonName + '</h3><p>' +
    (moonDetails[moonName] || 'Natural satellite') +
    '</p>';

  panel.style.display = 'block';
  return;
}
    const index = objects.indexOf(hits[0].object);
    const name = planets[index][0];

    
const details = {
  Mercury:
    "बुध (Mercury)<br>" +
    "Diameter: 4,879 km<br>" +
    "Sun Distance: 57.9 million km<br>" +
    "Year: 88 Earth days<br>" +
    "Day: 59 Earth days<br>" +
    "विशेष: सूर्याच्या सर्वात जवळचा आणि सर्वात लहान ग्रह.",

  Venus:
    "शुक्र (Venus)<br>" +
    "Diameter: 12,104 km<br>" +
    "Sun Distance: 108.2 million km<br>" +
    "Year: 225 Earth days<br>" +
    "Day: 243 Earth days<br>" +
    "विशेष: सौरमालेतील सर्वात उष्ण ग्रह.",

  Earth:
    "पृथ्वी (Earth)<br>" +
    "Diameter: 12,742 km<br>" +
    "Sun Distance: 149.6 million km<br>" +
    "Year: 365.25 days<br>" +
    "Day: 24 hours<br>" +
    "विशेष: जीवन अस्तित्वात असल्याचे ज्ञात असलेला एकमेव ग्रह.",

  Mars:
    "मंगळ (Mars)<br>" +
    "Diameter: 6,779 km<br>" +
    "Sun Distance: 227.9 million km<br>" +
    "Year: 687 Earth days<br>" +
    "Day: 24 hours 37 minutes<br>" +
    "विशेष: लाल ग्रह. येथे Olympus Mons हा विशाल ज्वालामुखी आहे.",

  Jupiter:
    "गुरू (Jupiter)<br>" +
    "Diameter: 139,820 km<br>" +
    "Sun Distance: 778.6 million km<br>" +
    "Year: 11.86 Earth years<br>" +
    "Day: 9 hours 56 minutes<br>" +
    "विशेष: सौरमालेतील सर्वात मोठा ग्रह. Great Red Spot वादळासाठी प्रसिद्ध.",

  Saturn:
    "शनी (Saturn)<br>" +
    "Diameter: 116,460 km<br>" +
    "Sun Distance: 1.43 billion km<br>" +
    "Year: 29.4 Earth years<br>" +
    "Day: 10.7 hours<br>" +
    "विशेष: बर्फ आणि खडकांपासून बनलेल्या सुंदर कड्यांसाठी प्रसिद्ध.",

  Uranus:
    "युरेनस (Uranus)<br>" +
    "Diameter: 50,724 km<br>" +
    "Sun Distance: 2.87 billion km<br>" +
    "Year: 84 Earth years<br>" +
    "Day: 17 hours 14 minutes<br>" +
    "विशेष: बाजूला कलून फिरणारा निळसर-हिरवा बर्फाळ ग्रह.",

  Neptune:
    "नेपच्यून (Neptune)<br>" +
    "Diameter: 49,244 km<br>" +
    "Sun Distance: 4.50 billion km<br>" +
    "Year: 165 Earth years<br>" +
    "Day: 16 hours<br>" +
    "विशेष: सूर्यापासून सर्वात दूरचा ग्रह. येथे अतिवेगवान वारे वाहतात."
};

    panel.innerHTML = '<h3>' + name + '</h3><p>' + details[name] + '</p>';
    panel.style.display = 'block';
  }
});
 
function animate(){
 requestAnimationFrame(animate);
 sun.rotation.y+=0.002;
  moonPivots.forEach((p,i) => {
  p.rotation.y += 0.01 + (i * 0.002);
});
 objects.forEach((p,i)=>p.rotation.y+=0.005+(i*0.001));
 controls.update();
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
} catch(e) {
 document.getElementById('error').textContent='3D Error: '+e.message;
 console.error(e);
}
</script>
<div id="planet-info" style="
position:fixed;
bottom:20px;
left:10px;
right:10px;
padding:15px;
background:rgba(0,0,0,0.85);
color:white;
border:1px solid #00d9ff;
border-radius:15px;
font-family:Arial;
z-index:9999;
">
<h3 id="planet-name">Welcome to Cosmic Explorer</h3>
<p id="planet-description">Tap a planet to explore its secrets!</p>
</div>

<script>
const planetDetails = {
  Mercury: "Mercury is the closest planet to the Sun.",
  Venus: "Venus is the hottest planet in our solar system.",
  Earth: "Earth is our home planet.",
  Mars: "Mars is known as the Red Planet.",
  Jupiter: "Jupiter is the largest planet.",
  Saturn: "Saturn is famous for its beautiful rings.",
  Uranus: "Uranus rotates on its side.",
  Neptune: "Neptune is a cold, distant ice giant."
};

document.addEventListener("click", function(event) {
  const planet = event.target.closest(".planet");
  if (!planet) return;

  const name = planet.dataset.name || planet.id;
  const description = planetDetails[name];

  if (description) {
    document.getElementById("planet-name").textContent = name;
    document.getElementById("planet-description").textContent = description;
  }
});
</script></body>
</html>
