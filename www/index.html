
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Universe Explorer</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#02040c;color:white;font-family:Arial}
h2{position:absolute;top:12px;width:100%;text-align:center;z-index:2}
#info{position:absolute;bottom:20px;left:15px;background:#101a30;padding:12px;border-radius:10px;z-index:2}
canvas{display:block}
#error{position:absolute;top:90px;left:10px;right:10px;color:#ffaaaa;text-align:center;z-index:3}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<h2>🌌 COSMIC UNIVERSE EXPLORER</h2>
<div id="info">Our Solar System<br>Explore the planets in 3D</div>
<div id="error"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

try {
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040c);

const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,12,32);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

scene.add(new THREE.AmbientLight(0xffffff,1.2));
const light = new THREE.PointLight(0xffffff,3,200);
scene.add(light);

const sun = new THREE.Mesh(
 new THREE.SphereGeometry(2,48,48),
 new THREE.MeshBasicMaterial({color:0xffaa22})
);
scene.add(sun);

const planets=[
 ['Mercury',0.45,4,0xaaaaaa],
 ['Venus',0.7,6,0xe5b66b],
 ['Earth',0.8,9,0x2277ff],
 ['Mars',0.6,12,0xcc5533],
 ['Jupiter',1.5,16,0xd5aa77],
 ['Saturn',1.3,20,0xd9c28b],
 ['Uranus',1,24,0x77ddff],
 ['Neptune',1,28,0x3355ff]
];

const objects=[];
planets.forEach((p,i)=>{
 const mesh=new THREE.Mesh(
  new THREE.SphereGeometry(p[1],48,48),
  new THREE.MeshStandardMaterial({color:p[3],roughness:0.85})
 );
 mesh.position.x=p[2];
 scene.add(mesh);
 objects.push(mesh);

 const orbit=new THREE.Mesh(
  new THREE.RingGeometry(p[2]-0.015,p[2]+0.015,128),
  new THREE.MeshBasicMaterial({color:0x445577,side:THREE.DoubleSide})
 );
 orbit.rotation.x=Math.PI/2;
 scene.add(orbit);

 if(p[0]==='Saturn'){
  const ring=new THREE.Mesh(
   new THREE.RingGeometry(1.6,2.5,64),
   new THREE.MeshStandardMaterial({color:0xc9b58b,side:THREE.DoubleSide})
  );
  ring.rotation.x=Math.PI/2.5;
  mesh.add(ring);
 }
});

function animate(){
 requestAnimationFrame(animate);
 sun.rotation.y+=0.002;
 objects.forEach((p,i)=>p.rotation.y+=0.005+(i*0.001));
 controls.update();
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
} catch(e) {
 document.getElementById('error').textContent='3D Error: '+e.message;
 console.error(e);
}
</script>
</body>
</html>
